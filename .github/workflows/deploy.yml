
name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Required permissions for Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set to your repository name if deploying to a project page: username.github.io/<repo>
  REPO_NAME: "<repository-name>"
  BUILD_DIR: "dist"

jobs:
  verify:
    name: Lint & Build (PR checks)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        # Requires ESLint devDependencies and an .eslintrc

      - name: Build
        run: |
          # Provide public path for project pages
          if [ -n "${{ env.REPO_NAME }}" ]; then
            PUBLIC_URL="/${{ env.REPO_NAME }}/" npm run build
          else
            npm run build
          fi
        env:
          CI: false

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_DIR }}

  build:
    name: Build & Upload Pages Artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          if [ -n "${{ env.REPO_NAME }}" ]; then
            PUBLIC_URL="/${{ env.REPO_NAME }}/" npm run build
          else
            npm run build
          fi
        env:
          CI: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Manual React App v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required permissions for Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # For a project page: username.github.io/<repo>
  REPO_NAME: "my-react-app"
  BUILD_DIR: "dist"

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build (PR)
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_URL: "/${{ env.REPO_NAME }}/" # critical for GH Pages

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_DIR }}

  build:
    name: Build & Upload Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build (push)
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_URL: "/${{ env.REPO_NAME }}/"

      - name: List build output
        run: ls -la ${{ env.BUILD_DIR }}

      - name: 404 for client-side routing
        run: cp ${{ env.BUILD_DIR }}/index.html ${{ env.BUILD_DIR }}/404.html || true
